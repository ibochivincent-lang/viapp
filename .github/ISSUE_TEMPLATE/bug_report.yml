name: 🐛 Bug Report
description: File a bug report to help us improve ViApp on Stellar
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: What network / browser / node version are you running?
      placeholder: e.g. Stellar Testnet, Node v22.12.0, Chrome 130
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: How can our team reproduce this?
      placeholder: |
        1. Go to '/send'
        2. Select '$AAPL'
        3. Click 'Send'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Tx Hashes
      render: shell

